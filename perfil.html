<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - DHON_IMPORTS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #0f172a; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.3rem; font-weight: bold; color: #38bdf8; text-decoration: none; }
        .container { max-width: 500px; width: 100%; margin: 30px auto; padding: 0 20px; flex: 1; }
        .card { background: #121826; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 25px; }
        h2 { color: #38bdf8; margin-bottom: 20px; font-size: 1.2rem; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: #94a3b8; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #0b0f19; color: #fff; font-size: 0.85rem; }
        button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 0.9rem; }
        .btn-voltar { display: block; text-align: center; background: #1e293b; text-decoration: none; color: #fff; padding: 10px; border-radius: 8px; margin-top: 15px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">DHON_IMPORTS</a>
        <a href="login.html" style="color: #38bdf8; text-decoration: none; font-size: 0.85rem;">Sair / Trocar Conta</a>
    </header>

    <div class="container">
        <div class="card">
            <h2>Atualizar Meu Perfil</h2>
            
            <div style="text-align: center; margin-bottom: 20px;">
                <div id="perfil-avatar-preview" style="width: 80px; height: 80px; border-radius: 50%; background: #1e293b; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; overflow:hidden; font-size: 1.8rem; border: 2px solid #38bdf8;">👤</div>
            </div>

            <form onsubmit="salvarPerfil(event)">
                <div class="form-group">
                    <label>Nome:</label>
                    <input type="text" id="input-perfil-nome" required>
                </div>
                <div class="form-group">
                    <label>E-mail (Não alterável):</label>
                    <input type="email" id="input-perfil-email" disabled style="opacity: 0.7; cursor: not-allowed;">
                </div>
                <div class="form-group">
                    <label>Nova Senha (Deixe em branco para não alterar):</label>
                    <input type="password" id="input-senha-nova" placeholder="Nova senha">
                </div>
                <div class="form-group">
                    <label>Foto de Perfil:</label>
                    <input type="file" id="input-perfil-foto" accept="image/*">
                </div>
                <button type="submit">Salvar Alterações</button>
            </form>

            <a href="index.html" class="btn-voltar">← Voltar para a Loja</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
