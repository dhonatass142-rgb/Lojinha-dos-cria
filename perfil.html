<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHON_IMPORTS - Meu Perfil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-painel">

    <div class="app-layout">
        <button class="menu-toggle-btn" onclick="toggleMenu()">☰</button>

        <aside id="sidebar-menu">
            <div class="sidebar-header-top">
                <div class="logo-area">
                    <h1>DHON_IMPORTS</h1>
                </div>
                <button class="close-menu-btn" onclick="toggleMenu()">✕</button>
            </div>
            
            <nav class="menu-nav">
                <a href="painel.html" class="menu-item">🏠 Início</a>
                <a href="produtos.html" class="menu-item">📦 Produtos</a>
                <a href="admin.html" class="menu-item">⚙️ Painel Admin</a>
                <a href="perfil.html" class="menu-item active">👤 Meu Perfil</a>
            </nav>
        </aside>

        <main>
            <header class="main-header">
                <h2>Editar Perfil</h2>
                <button class="btn-fp" onclick="fazerLogout()" style="background: var(--danger); border: none;">Sair da Conta</button>
            </header>

            <section class="section-block profile-edit-container">
                <form onsubmit="salvarPerfil(event)" class="profile-form">
                    
                    <div class="avatar-upload-section">
                        <div class="avatar-preview-big" id="perfil-avatar-preview">
                            👤
                        </div>
                        <label for="input-perfil-foto" class="btn-secondary" style="display: inline-block; cursor: pointer; margin-top: 10px;">
                            📷 Alterar Foto
                        </label>
                        <input type="file" id="input-perfil-foto" accept="image/*" style="display: none;">
                    </div>

                    <div class="form-grid">
                        <div class="input-group-perfil">
                            <label>Nome Completo:</label>
                            <input type="text" id="input-perfil-nome" placeholder="Seu nome" required>
                        </div>

                        <div class="input-group-perfil">
                            <label>E-mail (Login):</label>
                            <input type="email" id="input-perfil-email" readonly style="opacity: 0.6; cursor: not-allowed;">
                            <small style="color: var(--text-muted); font-size: 0.7rem;">O e-mail não pode ser alterado.</small>
                        </div>

                        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 10px 0;">

                        <div class="input-group-perfil">
                            <label>Senha Atual:</label>
                            <input type="password" id="input-senha-atual" placeholder="Sua senha atual">
                        </div>

                        <div class="input-group-perfil">
                            <label>Nova Senha (deixe vazio para não mudar):</label>
                            <input type="password" id="input-senha-nova" placeholder="Nova senha">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" style="margin-top: 20px;">Atualizar Meus Dados</button>
                </form>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
