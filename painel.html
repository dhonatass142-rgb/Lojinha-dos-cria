<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - DHON_IMPORTS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #0f172a; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.3rem; font-weight: bold; color: #38bdf8; text-decoration: none; }
        .container { max-width: 800px; width: 100%; margin: 30px auto; padding: 0 20px; flex: 1; }
        .card { background: #121826; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        h2 { color: #38bdf8; margin-bottom: 15px; font-size: 1.2rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: #94a3b8; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #0b0f19; color: #fff; font-size: 0.85rem; }
        button { padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-sair { background: #ef4444; }
        .btn-voltar { display: inline-block; background: #1e293b; text-decoration: none; color: #fff; padding: 10px 20px; border-radius: 8px; margin-top: 15px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">DHON_IMPORTS</a>
        <button class="btn-sair" onclick="fazerLogout()">Sair</button>
    </header>

    <div class="container">
        <div class="card">
            <h2>Bem-vindo ao Painel, <span id="nome-usuario-logado">Cliente</span>!</h2>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px;">Aqui você gerencia sua conta e acompanha suas solicitações.</p>
            <a href="index.html" class="btn-voltar">← Voltar para a Loja</a>
        </div>

        <div id="painel-admin-container" class="card" style="display:none;">
            <h2 style="color: #10b981;">Painel do Administrador ⚙️</h2>
            <form id="form-add-produto" onsubmit="cadastrarProduto(event)">
                <div class="form-group">
                    <label>Nome do Produto:</label>
                    <input type="text" id="prod-nome" required placeholder="Ex: Tênis Nike">
                </div>
                <div class="form-group">
                    <label>Preço (R$):</label>
                    <input type="text" id="prod-preco" required placeholder="Ex: 199,90">
                </div>
                <div class="form-group">
                    <label>Categoria:</label>
                    <select id="prod-categoria">
                        <option value="eletronicos">Eletrônicos</option>
                        <option value="perfumaria">Perfumaria</option>
                        <option value="calcados">Calçados</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Foto do Produto (Opcional):</label>
                    <input type="file" id="prod-foto" accept="image/*">
                </div>
                <button type="submit" style="background: #10b981;">Cadastrar Novo Produto</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
