<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DHON_IMPORTS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('Fundo-login.jpg.png') no-repeat center center fixed;
            background-size: cover;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        .login-card {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
        }
        .login-card h2 {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 5px;
            font-weight: 700;
        }
        .login-subtitle {
            font-size: 0.8rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(11, 15, 25, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        .form-group input:focus {
            border-color: #2563eb;
        }
        .btn-entrar {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(37, 99, 235,.4);
        }
        .divisor {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #64748b;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .divisor::before, .divisor::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .divisor::before { margin-right: 10px; }
        .divisor::after { margin-left: 10px; }
        .btn-criar {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .btn-criar:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .btn-voltar-loja {
            display: inline-block;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div style="font-size: 1.8rem; margin-bottom: 5px;">👑</div>
        <h2>DHON_IMPORTS</h2>
        <div class="login-subtitle">Bem-vindo</div>

        <form id="form-login" onsubmit="fazerLogin(event)">
            <div class="form-group">
                <input type="email" id="login-email" required placeholder="Usuário ou e-mail (admin@dhon.com)">
            </div>
            
            <div class="form-group">
                <input type="password" id="login-senha" required placeholder="Senha">
            </div>
            
            <button type="submit" class="btn-entrar">ENTRAR</button>
        </form>

        <div class="divisor">ou</div>

        <a href="cadastro.html" class="btn-criar">CRIAR UMA CONTA</a>

        <a href="index.html" class="btn-voltar-loja">← Voltar para a Loja</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
