<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DHON_IMPORTS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <h2>DHON_IMPORTS</h2>
        
        <form id="form-login" onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="login-email" required placeholder="admin@dhon.com">
            </div>
            
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="login-senha" required placeholder="Sua senha">
            </div>
            
            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <div class="auth-links">
            Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
        </div>

        <a href="index.html" class="btn-back">Voltar para a Loja</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
